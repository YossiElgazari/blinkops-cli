[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tforge"
version = "0.1.0"
description = "Command-line client for TicketForge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
tforge = "tforge.cli:app"

[tool.setuptools]
packages = ["tforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
